<svg xmlns="http://www.w3.org/2000/svg" viewBox="250 80 400 910" width="400" height="910" role="img" aria-labelledby="title desc">
  <title id="title">Боксёр — силуэт статуэтки</title>
  <desc id="desc">Одноцветный силуэт боксёра по фотографии: одна рука вытянута влево, другая согнута перед грудью, ноги расставлены. Статуэтка стоит на овальном основании. Цвет — глубокий синий, фон прозрачный.</desc>
