<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Шапка сайта</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@200;300;400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<header style="font-family: 'Onest', system-ui, sans-serif; color: #252932; padding: 16px 48px 0; box-sizing: border-box; width: 100%">
<div style="position: relative; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid #C9D1DB">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 400; letter-spacing: -0.01em; color: #252932; text-decoration: none">
<img src="/_blob/450b2160012cd8f6c7fdb8f130e8930a" alt="" style="height: 38px; width: auto">
<span>Советский пластик</span>
</a>
<div style="display: flex; align-items: center; gap: 40px">
<nav aria-label="Основное меню" style="display: flex; flex-wrap: wrap; gap: 38px; font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase">
<sc-for list="{{ links }}" as="link" hint-placeholder-count="2">
<a href="{{ link.href }}" class="sp-navlink" style="position: relative; padding: 6px 0; color: #252932; text-decoration: none">{{ link.label }}<sc-if value="{{ link.active }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 0; right: 0; bottom: -3px; height: 1px; background: #A9B9D2"></span></sc-if></a>
</sc-for>
</nav>
<sc-if value="{{ signedOut }}" hint-placeholder-val="{{ true }}">
<a href="Login.dc.html" style="display: inline-flex; align-items: center; height: 40px; padding: 0 18px; border: 1px solid #C9D1DB; border-radius: 6px; background: transparent; color: #1B2A41; font-family: inherit; font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; box-sizing: border-box">Войти</a>
</sc-if>
<sc-if value="{{ signedIn }}" hint-placeholder-val="{{ false }}">
<div style="position: relative">
<button type="button" aria-label="Профиль" aria-haspopup="menu" aria-expanded="{{ menuExpanded }}" onClick="{{ toggleMenu }}" style="width: 40px; height: 40px; padding: 0; border: 1px solid #C9D1DB; border-radius: 50%; background: #F8FAFD; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; box-sizing: border-box">
<sc-if value="{{ hasAvatar }}" hint-placeholder-val="{{ false }}"><img src="{{ avatar }}" alt="" style="width: 100%; height: 100%; object-fit: cover"></sc-if>
<sc-if value="{{ noAvatar }}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2A41" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="8.5" r="4"></circle><path d="M4 21c0-4.4 3.6-7.5 8-7.5s8 3.1 8 7.5" stroke-linecap="round"></path></svg></sc-if>
</button>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<div role="menu" style="position: absolute; top: calc(100% + 8px); right: 0; z-index: 50; min-width: 200px; padding: 6px; background: #FFFFFF; border: 1px solid #DCE2EA; border-radius: 8px; box-shadow: 0 12px 32px rgba(27, 42, 65, 0.12); box-sizing: border-box">
<a href="Account.dc.html" role="menuitem" style="display: flex; align-items: center; height: 40px; padding: 0 12px; border-radius: 6px; color: #252932; font-size: 15px; text-decoration: none">Личный кабинет</a>
<button type="button" role="menuitem" onClick="{{ signOut }}" style="width: 100%; height: 40px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #252932; font-family: inherit; font-size: 15px; text-align: left; cursor: pointer">Выйти</button>
</div>
</sc-if>
</div>
</sc-if>
</div>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["","catalog","materials"],"default":""},"signedIn":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":71}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { signedIn: null, avatar: '', menuOpen: false };
  }
  componentDidMount() {
    var self = this;
    this.spRead();
    this._sync = function () { self.spRead(); };
    try { window.addEventListener('storage', this._sync); window.addEventListener('focus', this._sync); } catch (e) {}
  }
  componentWillUnmount() {
    try { window.removeEventListener('storage', this._sync); window.removeEventListener('focus', this._sync); } catch (e) {}
  }
  spRead() {
    try {
      var auth = window.localStorage.getItem('sp-auth') === '1';
      var prof = JSON.parse(window.localStorage.getItem('sp-profile') || '{}') || {};
      this.setState({ signedIn: auth ? true : null, avatar: prof.avatar || '' });
    } catch (e) {}
  }
  renderVals() {
    var self = this;
    var cur = this.props.current || '';
    var signed = this.state.signedIn === null ? !!this.props.signedIn : this.state.signedIn;
    var links = [
      { key: 'catalog', label: 'Коллекция', href: 'Catalog.dc.html' },
      { key: 'materials', label: 'Статьи', href: 'Materials.dc.html' }
    ].map(function (l) { return Object.assign({}, l, { active: l.key === cur }); });
    return {
      links: links,
      signedIn: signed,
      signedOut: !signed,
      avatar: this.state.avatar,
      hasAvatar: !!this.state.avatar,
      noAvatar: !this.state.avatar,
      menuOpen: this.state.menuOpen,
      menuExpanded: this.state.menuOpen ? 'true' : 'false',
      signOut: function () { try { window.localStorage.removeItem('sp-auth'); } catch (e) {} self.setState({ signedIn: false, menuOpen: false }); },
      toggleMenu: function () { self.setState({ menuOpen: !self.state.menuOpen }); }
    };
  }
}
</script>
</body>
</html>
